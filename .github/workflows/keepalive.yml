name: keepalive
# GitHub disables scheduled workflows after 60 days without repository activity.
# This makes an empty commit once a month so the pipeline never stops.
on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "keepalive-bot"
          git config user.email "keepalive-bot@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep scheduled workflows active"
          git push
