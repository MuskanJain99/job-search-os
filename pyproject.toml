[project]
name = "job-search-os"
version = "0.1.0"
description = "Automated, evidence-grounded job search pipeline: discover → score → tailor → apply → outreach → track."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "jinja2>=3.1",
  "playwright>=1.47",
  "google-api-python-client>=2.140",
  "google-auth>=2.34",
  "google-auth-oauthlib>=1.2",
  "anthropic>=0.40",
  "openai>=1.50",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
jobsearch = "jobsearch.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobsearch*"]

[tool.setuptools.package-data]
jobsearch = ["templates/*.html"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "UP017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
